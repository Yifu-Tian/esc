[project]
name = "esc"
version = "0.1.0"
description = "Every Step Counts: history-conditioned trajectory generation for tethered robot motion"
requires-python = ">=3.9"
dependencies = [
  "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["outputs", "data", "models", "third_party"]
